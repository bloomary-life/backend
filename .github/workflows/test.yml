name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Trace check
        if: hashFiles('REQUIREMENTS.md') != ''
        run: bash scripts/trace-check.sh REQUIREMENTS.md .
